<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feuerwehr Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #1c1c1e;
      color: #f2f2f7;
      overflow-x: hidden;
    }

    /* Header-Bild mit sanftem Verlauf & Tag/Nacht-Übergang */
    .header-container {
      position: relative;
      width: 100%;
      height: 155px;
      background-image: url('feuerwehr-tag.jpeg');
      background-size: cover;
      background-position: center;
      transition: background-image 1s ease-in-out;
    }

    .header-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(28, 28, 30, 0.1) 20%,
        rgba(28, 28, 30, 0.85) 80%,
        #1c1c1e 100%
      );
    }

    .content {
      position: relative;
      margin-top: -32px;
      padding: 0 18px 20px 18px;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .widget-title {
      font-size: 17px;
      font-weight: 700;
      color: #64b5f6;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .update-time {
      font-size: 13px;
      color: #8e8e93;
    }

    .section-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #8e8e93;
      margin: 14px 0 8px 0;
      font-weight: 600;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14.5px;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
    }

    /* Hebt frische Einsätze (< 2 Stunden) leicht rötlich hervor */
    .row.fresh-alarm {
      background: rgba(220, 38, 38, 0.22);
      border: 1px solid rgba(239, 68, 68, 0.45);
    }

    .row-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .row-right {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #d1d1d6;
      font-size: 13.5px;
    }

    .status-icon {
      font-size: 15px;
    }

    .empty-text {
      color: #8e8e93;
      font-size: 14px;
      font-style: italic;
      padding: 4px 0;
    }
  </style>
</head>
<body>

  <div class="header-container" id="header-banner">
    <div class="header-gradient"></div>
  </div>

  <div class="content">
    <div class="title-row">
      <div class="widget-title">🚒 Feuerwehr &amp; Einsatz</div>
      <div class="update-time" id="clock">--:-- Uhr</div>
    </div>

    <div class="section-label">Letzte Einsätze</div>
    <div class="list" id="einsaetze-list">
      <div class="empty-text">Lade Einsätze...</div>
    </div>

    <div class="section-label">Nächste Termine</div>
    <div class="list" id="termine-list">
      <div class="empty-text">Lade Termine...</div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://feuerwehr-widget.oliver-beer1989.workers.dev";

    // Koordinaten für Sonnenaufgang / Sonnenuntergang (Schöneiche bei Berlin)
    const LAT = 52.475;
    const LNG = 13.700;

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent =
        now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
    }

    async function updateDayNightBanner() {
      const banner = document.getElementById("header-banner");
      try {
        const res = await fetch(`https://sunrise-sunset.org{LAT}&lng=${LNG}&formatted=0`);
        const data = await res.json();

        if (data.status === "OK") {
          const now = new Date();
          const sunrise = new Date(data.results.sunrise);
          const sunset = new Date(data.results.sunset);

          const isDay = now >= sunrise && now < sunset;
          banner.style.backgroundImage = isDay
            ? "url('feuerwehr-tag.jpg')"
            : "url('feuerwehr-nacht.jpg')";
        }
      } catch (e) {
        const hour = new Date().getHours();
        const isDayFallback = hour >= 7 && hour < 19;
        banner.style.backgroundImage = isDayFallback
          ? "url('feuerwehr-tag.jpg')"
          : "url('feuerwehr-nacht.jpg')";
      }
    }

    async function loadData() {
      try {
        const res = await fetch(WORKER_URL);
        const data = await res.json();

        // 1. Einsätze rendern
        const einsaetzeEl = document.getElementById("einsaetze-list");
        if (!data.einsaetze || data.einsaetze.length === 0) {
          einsaetzeEl.innerHTML = '<div class="empty-text">Keine aktuellen Einsätze</div>';
        } else {
          const now = Date.now();
          einsaetzeEl.innerHTML = data.einsaetze.map(item => {
            const isFR = item.einheit.toLowerCase().includes("first") || item.einheit.toLowerCase().includes("responder");
            const unitEmoji = isFR ? "🚑" : "🚒";
            const statusEmoji = item.status === "ja" ? "✅" : "❌";
            const isFresh = (now - item.timestamp) < (2 * 60 * 60 * 1000);

            return `
              <div class="row ${isFresh ? 'fresh-alarm' : ''}">
                <div class="row-left">
                  <span>${unitEmoji}</span>
                  <span>${item.einheit}</span>
                </div>
                <div class="row-right">
                  <span>${item.datum} · ${item.uhrzeit}</span>
                  <span class="status-icon">${statusEmoji}</span>
                </div>
              </div>
            `;
          }).join("");
        }

        // 2. Termine rendern
        const termineEl = document.getElementById("termine-list");
        if (!data.termine || data.termine.length === 0) {
          termineEl.innerHTML = '<div class="empty-text">Keine anstehenden Termine</div>';
        } else {
          termineEl.innerHTML = data.termine.map(t => `
            <div class="row">
              <div class="row-left">
                <span>📅</span>
                <span>${t.titel}</span>
              </div>
              <div class="row-right">
                <span>${t.datum} · ${t.uhrzeit}</span>
              </div>
            </div>
          `).join("");
        }

      } catch (err) {
        console.error("Fehler beim Laden:", err);
      }
    }

    updateClock();
    updateDayNightBanner();
    loadData();

    setInterval(updateClock, 30000);
    setInterval(updateDayNightBanner, 15 * 60 * 1000);
    setInterval(loadData, 60000);
  </script>
</body>
</html>
