name: Frachtschiffe Hamburg aktualisieren

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fracht:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright installieren
        run: npm install --no-save playwright && npx playwright install chromium

      - name: Hamburger Schiffe abrufen und fracht.json erstellen
        run: |
          cat << 'EOF' > fetch-fracht.mjs
          import { chromium } from 'playwright';
          import fs from 'fs';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            locale: 'de-DE',
            userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          });
          const page = await context.newPage();

          const monate = {
            januar: '01', februar: '02', 'märz': '03', maerz: '03', april: '04',
            mai: '05', juni: '06', juli: '07', august: '08',
            september: '09', oktober: '10', november: '11', dezember: '12'
          };

          const schiffe = [];
          const urls = [
            'https://hafen-hamburg.de',
            'https://hafen-hamburg.de',
            'https://hafen-hamburg.de'
          ];

          for (const targetUrl of urls) {
            try {
              await page.goto(targetUrl, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForTimeout(3500);
              await page.locator('button:has-text("Akzeptieren"), button:has-text("Alle akzeptieren")').first().click({ timeout: 1500 }).catch(() => {});
              await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
              await page.waitForTimeout(2000);

              const text = await page.evaluate(() => document.body.innerText);
              const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
              console.log(targetUrl, '-> Zeilen:', lines.length);

              for (let i = 0; i < lines.length; i++) {
                const line = lines.at(i);
                const lenMatch = line.match(/Länge:\s*([1-4]\d{2})(?:[.,]\d+)?\s*m/i);
                if (!lenMatch) continue;
                const laenge = parseInt(lenMatch.at(1), 10);
                if (laenge < 150) continue;

                // Rückwärts nach Datum/Terminal und Schiffsname suchen
                let dateInfo = null;
                let liegeplatz = 'Hafen Hamburg';
                let name = '';

                for (let back = 1; back <= 5 && (i - back) >= 0; back++) {
                  const prev = lines.at(i - back);
                  const dm = prev.match(/^(\d{1,2})\.\s*([A-Za-zäöüÄÖÜ]+)\s+(\d{4})\s+(\d{2}:\d{2})(?:\s*\|\s*(.+))?$/i)
                    || prev.match(/^(\d{1,2})\s+([A-Za-zäöüÄÖÜ]+)\s+(\d{4})\s+(\d{2}:\d{2})(?:\s*\|\s*(.+))?$/i);
                  if (dm) {
                    const tag = String(dm.at(1)).padStart(2, '0');
                    const monName = dm.at(2).toLowerCase();
                    const monat = monate[monName];
                    const jahr = dm.at(3);
                    const zeit = dm.at(4);
                    const term = (dm.at(5) || '').trim();
                    if (monat) {
                      dateInfo = { iso: `${jahr}-${monat}-${tag}`, zeit, info: `${tag}.${monat}. ${zeit} Uhr` };
                      if (term && term !== '-') liegeplatz = term;
                      if ((i - back + 1) < i) {
                        const candidateName = lines.at(i - back + 1);
                        if (candidateName && !/Tragfähigkeit|Länge:|Breite:|TEU:|BRZ:/i.test(candidateName)) {
                          name = candidateName;
                        }
                      }
                      break;
                    }
                  }
                }

                if (!name && i >= 2) {
                  const fallbackName = lines.at(i - 2);
                  if (fallbackName && !/^\d/.test(fallbackName) && !/Tragfähigkeit|Länge:/i.test(fallbackName)) {
                    name = fallbackName;
                  }
                }

                if (!name || !dateInfo) continue;

                const isAbfahrtListe = targetUrl.includes('schiffe-im-ueberblick');
                // Standard-Liegezeit ca. 24h für Status-Anzeige falls Abfahrt nicht separat angegeben
                const ankDate = new Date(`${dateInfo.iso}T${dateInfo.zeit}:00Z`);
                const estAbfDate = new Date(ankDate.getTime() + 24 * 60 * 60 * 1000);
                const estAbfIso = estAbfDate.toISOString().slice(0, 10);
                const estAbfTag = estAbfIso.slice(8, 10);
                const estAbfMon = estAbfIso.slice(5, 7);

                if (!schiffe.some(s => s.name.toLowerCase() === name.toLowerCase() && s.ankunftIso === dateInfo.iso)) {
                  schiffe.push({
                    name,
                    laenge,
                    liegeplatz,
                    ankunftIso: dateInfo.iso,
                    planAnkunft: dateInfo.zeit,
                    planAnkunftInfo: dateInfo.info,
                    istAnkunft: isAbfahrtListe ? dateInfo.zeit : '',
                    abfahrtIso: estAbfIso,
                    planAbfahrtZeit: dateInfo.zeit,
                    planAbfahrtInfo: `${estAbfTag}.${estAbfMon}. ${dateInfo.zeit} Uhr (ca.)`
                  });
                }
              }
            } catch (e) {
              console.log('Fehler bei', targetUrl, e.message);
            }
          }

          await browser.close();
          fs.writeFileSync('fracht.json', JSON.stringify(schiffe, null, 2));
          console.log('Gefundene Hamburger Schiffe ab 150m:', schiffe.length);
          EOF
          node fetch-fracht.mjs
          rm -f fetch-fracht.mjs

      - name: fracht.json in GitHub speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add fracht.json
          git diff --staged --quiet || git commit -m "Update fracht.json"
          git push
