name: Frachtschiffe Hamburg aktualisieren

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fracht:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright installieren
        run: npm install --no-save playwright && npx playwright install chromium

      - name: Hamburger Schiffe inkl. Echtzeit-Hafenstatus abrufen
        run: |
          cat << 'EOF' > fetch-fracht.mjs
          import { chromium } from 'playwright';
          import fs from 'fs';

          // Bisherige Daten laden, um einmal erkannte Ist-Ankunftszeiten zu behalten
          let altDaten = [];
          try {
            if (fs.existsSync('fracht.json')) {
              altDaten = JSON.parse(fs.readFileSync('fracht.json', 'utf8'));
            }
          } catch (e) {}

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            locale: 'de-DE',
            userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          });
          const page = await context.newPage();

          const monate = {
            januar: '01', februar: '02', 'märz': '03', maerz: '03', april: '04',
            mai: '05', juni: '06', juli: '07', august: '08',
            september: '09', oktober: '10', november: '11', dezember: '12'
          };

          const now = new Date();
          const heuteIso = now.toLocaleDateString('sv-SE', { timeZone: 'Europe/Berlin' });
          const jetztUhrzeit = now.toLocaleTimeString('de-DE', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit', hour12: false });

          const schiffe = [];
          const imHafenNamen = new Set();

          const parsePageText = (text, isHafenListe) => {
            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            for (let i = 0; i < lines.length; i++) {
              const line = lines.at(i);
              const lenMatch = line.match(/Länge:\s*([1-4]\d{2})(?:[.,]\d+)?\s*m/i)
                || line.match(/^([1-4]\d{2})(?:[.,]\d+)?\s*m$/i);
              if (!lenMatch) continue;
              const laenge = parseInt(lenMatch.at(1), 10);
              if (laenge < 150) continue;

              let dateInfo = null;
              let liegeplatz = 'Hafen Hamburg';
              let name = '';

              for (let back = 1; back <= 6 && (i - back) >= 0; back++) {
                const prev = lines.at(i - back);
                const dm = prev.match(/^(\d{1,2})\.?\s+([A-Za-zäöüÄÖÜ]+)\s+(\d{4})\s+(\d{2}:\d{2})(?:\s*\|\s*(.+))?$/i)
                  || prev.match(/^(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}:\d{2})(?:\s*\|\s*(.+))?$/i);
                if (dm) {
                  let tag, monat, jahr, zeit, term;
                  if (/^\d{2}$/.test(dm.at(2))) {
                    tag = dm.at(1); monat = dm.at(2); jahr = dm.at(3); zeit = dm.at(4); term = (dm.at(5) || '').trim();
                  } else {
                    tag = String(dm.at(1)).padStart(2, '0');
                    monat = monate[dm.at(2).toLowerCase()];
                    jahr = dm.at(3); zeit = dm.at(4); term = (dm.at(5) || '').trim();
                  }
                  if (monat) {
                    dateInfo = { iso: `${jahr}-${monat}-${tag}`, zeit, info: `${tag}.${monat}. ${zeit} Uhr` };
                    if (term && term !== '-') liegeplatz = term;
                    if ((i - back + 1) < i) {
                      const cand = lines.at(i - back + 1);
                      if (cand && !/Tragfähigkeit|Länge:|Breite:|TEU:|BRZ:/i.test(cand)) name = cand;
                    }
                    break;
                  }
                }
              }

              if (!name && i >= 2) {
                const cand = lines.at(i - 2);
                if (cand && !/^\d/.test(cand) && !/Tragfähigkeit|Länge:/i.test(cand)) name = cand;
              }
              if (!name) continue;

              if (isHafenListe) {
                imHafenNamen.add(name.toLowerCase());
              }

              if (!dateInfo) {
                dateInfo = { iso: heuteIso, zeit: jetztUhrzeit, info: `${heuteIso.slice(8, 10)}.${heuteIso.slice(5, 7)}. ${jetztUhrzeit} Uhr` };
              }

              const alt = altDaten.find(a => a.name && a.name.toLowerCase() === name.toLowerCase());
              const schonImHafen = isHafenListe || imHafenNamen.has(name.toLowerCase()) || Boolean(alt?.imHafen);

              let istAnkunft = alt?.istAnkunft || '';
              if (schonImHafen && !istAnkunft) {
                istAnkunft = isHafenListe && dateInfo.iso <= heuteIso ? dateInfo.zeit : jetztUhrzeit;
              }

              const ankDate = new Date(`${dateInfo.iso}T${dateInfo.zeit}:00Z`);
              const estAbfDate = new Date(ankDate.getTime() + 24 * 60 * 60 * 1000);
              const estAbfIso = estAbfDate.toISOString().slice(0, 10);

              const existing = schiffe.find(s => s.name.toLowerCase() === name.toLowerCase());
              if (existing) {
                if (schonImHafen) {
                  existing.imHafen = true;
                  if (!existing.istAnkunft) existing.istAnkunft = istAnkunft;
                }
                if (liegeplatz !== 'Hafen Hamburg') existing.liegeplatz = liegeplatz;
              } else {
                schiffe.push({
                  name,
                  laenge,
                  liegeplatz,
                  imHafen: schonImHafen,
                  ankunftIso: dateInfo.iso,
                  planAnkunft: dateInfo.zeit,
                  planAnkunftInfo: dateInfo.info,
                  istAnkunft,
                  abfahrtIso: estAbfIso,
                  planAbfahrtZeit: dateInfo.zeit,
                  planAbfahrtInfo: `${estAbfIso.slice(8, 10)}.${estAbfIso.slice(5, 7)}. ${dateInfo.zeit} Uhr (ca.)`
                });
              }
            }
          };

          // 1. Zuerst "Schiffe im Überblick" (bereits im Hafen liegende Schiffe!) prüfen
          await page.goto('https://hafen-hamburg.de', { waitUntil: 'domcontentloaded', timeout: 45000 });
          await page.waitForTimeout(2500);
          await page.locator('button:has-text("Akzeptieren"), button:has-text("Alle akzeptieren")').first().click({ timeout: 1500 }).catch(() => {});

          const ueberblickLink = page.locator('a:has-text("Schiffe im Überblick")').first();
          if (await ueberblickLink.count() > 0) {
            await ueberblickLink.click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(3500);
            for (let s = 0; s < 4; s++) {
              await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
              await page.waitForTimeout(1000);
            }
            parsePageText(await page.evaluate(() => document.body.innerText), true);
          }

          // 2. Danach "Alle erwarteten Schiffe" prüfen
          await page.goto('https://hafen-hamburg.de', { waitUntil: 'domcontentloaded', timeout: 45000 });
          await page.waitForTimeout(2000);
          parsePageText(await page.evaluate(() => document.body.innerText), false);

          const alleLink = page.locator('a:has-text("Alle erwarteten Schiffe"), a:has-text("Erwartete Schiffe")').first();
          if (await alleLink.count() > 0) {
            await alleLink.click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(3500);
            for (let s = 0; s < 4; s++) {
              await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
              await page.waitForTimeout(1000);
            }
            parsePageText(await page.evaluate(() => document.body.innerText), false);
          }

          await browser.close();
          fs.writeFileSync('fracht.json', JSON.stringify(schiffe, null, 2));
          console.log('Gesamt:', schiffe.length, 'Davon bereits im Hafen:', schiffe.filter(s => s.imHafen).length);
          EOF
          node fetch-fracht.mjs
          rm -f fetch-fracht.mjs

      - name: fracht.json in GitHub speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add fracht.json
          git diff --staged --quiet || git commit -m "Update fracht.json"
          git push
