name: Frachtschiffe Hamburg aktualisieren

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fracht:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright installieren
        run: npm install --no-save playwright && npx playwright install chromium

      - name: Hamburger Schiffe (Ein- & Auslaufend) abrufen
        run: |
          cat << 'EOF' > fetch-fracht.mjs
          import { chromium } from 'playwright';
          import fs from 'fs';

          let altDaten = [];
          try {
            if (fs.existsSync('fracht.json')) {
              altDaten = JSON.parse(fs.readFileSync('fracht.json', 'utf8'));
            }
          } catch (e) {}

          let elbeMap = {};
          try {
            if (fs.existsSync('elbe-pos.json')) {
              elbeMap = JSON.parse(fs.readFileSync('elbe-pos.json', 'utf8'));
            }
          } catch (e) {}

          const cleanPosKey = (raw) => String(raw || '').replace(/^(?:M\/V|MV|MS|M\/S|CMS)\s+/i, '').replace(/[^A-Z0-9]/gi, '').toUpperCase();
          const getElbeInfo = (name) => {
            const k = cleanPosKey(name);
            if (!k) return null;
            if (elbeMap[k]) return elbeMap[k];
            const mk = Object.keys(elbeMap).find(x => x !== '_mmsiCache' && (x.includes(k) || k.includes(x)));
            return mk ? elbeMap[mk] : null;
          };

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            locale: 'de-DE',
            userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          });
          const page = await context.newPage();

          const monate = {
            januar: '01', februar: '02', 'märz': '03', maerz: '03', april: '04',
            mai: '05', juni: '06', juli: '07', august: '08',
            september: '09', oktober: '10', november: '11', dezember: '12'
          };

          const now = new Date();
          const heuteIso = now.toLocaleDateString('sv-SE', { timeZone: 'Europe/Berlin' });
          const heuteDate = new Date(heuteIso + 'T00:00:00Z');
          const gesternIso = new Date(heuteDate.getTime() - 86400000).toISOString().slice(0, 10);
          const jetztUhrzeit = now.toLocaleTimeString('de-DE', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit', hour12: false });
          const signalKurz = `${heuteIso.slice(8, 10)}.${heuteIso.slice(5, 7)}. ${jetztUhrzeit}`;

          const gesammelte = new Map();

          const extractCards = (text, isAbfahrtDefault) => {
            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            for (let i = 0; i < lines.length; i++) {
              const line = lines.at(i);
              const lenMatch = line.match(/Länge:\s*([1-4]\d{2})(?:[.,]\d+)?\s*m/i)
                || line.match(/^([1-4]\d{2})(?:[.,]\d+)?\s*m$/i);
              if (!lenMatch) continue;
              const laenge = parseInt(lenMatch.at(1), 10);
              if (laenge < 150) continue;

              let dateInfo = null;
              let liegeplatz = 'Hafen Hamburg';
              let name = '';
              let isAbfahrtCard = isAbfahrtDefault;

              for (let back = 1; back <= 6 && (i - back) >= 0; back++) {
                const prev = lines.at(i - back);
                if (/abfahrt|auslaufend|departure/i.test(prev)) isAbfahrtCard = true;
                const dm = prev.match(/^(\d{1,2})\.?\s+([A-Za-zäöüÄÖÜ]+)\s+(\d{4})\s+(\d{2}:\d{2})(?:\s*\|\s*(.+))?$/i)
                  || prev.match(/^(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}:\d{2})(?:\s*\|\s*(.+))?$/i);
                if (dm) {
                  let tag, monat, jahr, zeit, term;
                  if (/^\d{2}$/.test(dm.at(2))) {
                    tag = dm.at(1); monat = dm.at(2); jahr = dm.at(3); zeit = dm.at(4); term = (dm.at(5) || '').trim();
                  } else {
                    tag = String(dm.at(1)).padStart(2, '0');
                    monat = monate[dm.at(2).toLowerCase()];
                    jahr = dm.at(3); zeit = dm.at(4); term = (dm.at(5) || '').trim();
                  }
                  if (monat) {
                    dateInfo = { iso: `${jahr}-${monat}-${tag}`, zeit, info: `${tag}.${monat}. ${zeit} Uhr` };
                    if (term && term !== '-') liegeplatz = term;
                    if ((i - back + 1) < i) {
                      const cand = lines.at(i - back + 1);
                      if (cand && !/Tragfähigkeit|Länge:|Breite:|TEU:|BRZ:/i.test(cand)) name = cand;
                    }
                    break;
                  }
                }
              }

              if (!name && i >= 2) {
                const cand = lines.at(i - 2);
                if (cand && !/^\d/.test(cand) && !/Tragfähigkeit|Länge:/i.test(cand)) name = cand;
              }
              if (!name) continue;

              const key = name.toLowerCase();
              const existing = gesammelte.get(key) || {};
              gesammelte.set(key, {
                name,
                laenge,
                liegeplatz: liegeplatz !== 'Hafen Hamburg' ? liegeplatz : (existing.liegeplatz || 'Hafen Hamburg'),
                ankunftInfo: !isAbfahrtCard ? (dateInfo || existing.ankunftInfo) : existing.ankunftInfo,
                abfahrtInfo: isAbfahrtCard ? (dateInfo || existing.abfahrtInfo) : existing.abfahrtInfo,
                isAbfahrt: existing.isAbfahrt || isAbfahrtCard
              });
            }
          };
          const expandAndExtract = async (isAbfDefault) => {
            for (let step = 0; step < 15; step++) {
              const clicked = await page.locator('button:has-text("Mehr"), a:has-text("Mehr laden"), button:has-text("Weitere")')
                .first()
                .click({ timeout: 1000, force: true })
                .then(() => true)
                .catch(() => false);
              await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
              await page.waitForTimeout(clicked ? 1400 : 500);
              if (!clicked && step >= 2) break;
            }
            const txt = await page.evaluate(() => document.body.innerText);
            extractCards(txt, isAbfDefault);
          };

          const searchUrls = [
            'https://hafen-hamburg.de',
            'https://hafen-hamburg.de?schiffe=169804&kreuzfahrt-segelliste=169806'
          ];

          for (const targetUrl of searchUrls) {
            try {
              await page.goto(targetUrl, { waitUntil: 'domcontentloaded', timeout: 45000 }).catch(() => {});
              await page.waitForTimeout(3000);
              await page.locator('button:has-text("Akzeptieren"), button:has-text("Alle akzeptieren")').first().click({ timeout: 1500 }).catch(() => {});
              await expandAndExtract(false);

              // Im Suchformular gezielt auf "Abfahrt" / "Abfahrende" umschalten und Such-Button absenden
              const abfToggle = page.locator('label:has-text("Abfahrt"), label:has-text("Abfahrende"), input[value*="abfahrt" i], input[value*="departure" i]').first();
              if (await abfToggle.count() > 0) {
                await abfToggle.click({ timeout: 2000, force: true }).catch(() => {});
                await page.waitForTimeout(800);
                const submitBtn = page.locator('button[type="submit"], input[type="submit"], button:has-text("Suchen"), button:has-text("Anzeigen"), button:has-text("Filtern")').first();
                if (await submitBtn.count() > 0) {
                  await submitBtn.click({ timeout: 2000, force: true }).catch(() => {});
                }
                await page.waitForTimeout(3000);
                await expandAndExtract(true);
              }

              // Falls ein Select-Dropdown für Richtung existiert, ebenfalls "Abfahrt" wählen & absenden
              const selects = await page.locator('select').all();
              for (const sel of selects) {
                const opts = await sel.locator('option').all();
                for (const opt of opts) {
                  const val = await opt.getAttribute('value').catch(() => null);
                  const lbl = (await opt.innerText().catch(() => '')).trim();
                  if (/abfahr|auslauf|depart/i.test(lbl) || /abfahr|auslauf|depart/i.test(val || '')) {
                    await sel.selectOption(val || { label: lbl }).catch(() => {});
                    const submitBtn = page.locator('button[type="submit"], input[type="submit"], button:has-text("Suchen"), button:has-text("Anzeigen")').first();
                    if (await submitBtn.count() > 0) {
                      await submitBtn.click({ timeout: 2000, force: true }).catch(() => {});
                    }
                    await page.waitForTimeout(3000);
                    await expandAndExtract(true);
                  }
                }
              }
            } catch (e) {
              console.log('Hinweis', targetUrl, e.message);
            }
          }

          await browser.close();

          const finalList = [];

          for (const [key, cur] of gesammelte.entries()) {
            const alt = altDaten.find(a => a.name && a.name.toLowerCase() === key);
            const elbe = getElbeInfo(cur.name);
            const elbeOrt = elbe?.ort || '';

            const ankObj = cur.ankunftInfo || (alt?.ankunftIso ? { iso: alt.ankunftIso, zeit: alt.planAnkunft, info: alt.planAnkunftInfo } : null) || { iso: heuteIso, zeit: jetztUhrzeit, info: `${signalKurz} Uhr` };
            const ankTs = new Date(`${ankObj.iso}T${ankObj.zeit}:00`).getTime();
            const planZeitErreicht = !Number.isNaN(ankTs) && now.getTime() >= ankTs;

            const istJetztImHafen = elbeOrt === 'Im Hafen.' || planZeitErreicht;
            const warSchonImHafen = Boolean(alt?.imHafen);

            let istAnkunft = alt?.istAnkunft || '';
            if (istJetztImHafen && !istAnkunft) {
              const sigZeit = elbe?.uhrzeit || jetztUhrzeit;
              istAnkunft = `${heuteIso.slice(8, 10)}.${heuteIso.slice(5, 7)}. ${sigZeit} Uhr (Signal)`;
            }

            const ankDate = new Date(`${ankObj.iso}T${ankObj.zeit}:00Z`);
            const estAbfDate = new Date(ankDate.getTime() + 24 * 60 * 60 * 1000);
            const estAbfIso = estAbfDate.toISOString().slice(0, 10);

            const abfObj = cur.abfahrtInfo || (alt?.abfahrtIso && alt?.planAbfahrtZeit ? { iso: alt.abfahrtIso, zeit: alt.planAbfahrtZeit, info: alt.planAbfahrtInfo } : null);
            const nurAbfahrt = Boolean(cur.isAbfahrt && !cur.ankunftInfo);

            finalList.push({
              name: cur.name,
              laenge: cur.laenge,
              liegeplatz: cur.liegeplatz,
              richtung: nurAbfahrt ? 'ABFAHRT' : 'ANKUNFT',
              imHafen: nurAbfahrt ? true : (istJetztImHafen || warSchonImHafen),
              abgelegt: false,
              ankunftIso: nurAbfahrt ? gesternIso : ankObj.iso,
              planAnkunft: nurAbfahrt ? '—' : ankObj.zeit,
              planAnkunftInfo: nurAbfahrt ? 'Im Hafen' : ankObj.info,
              istAnkunft: nurAbfahrt ? '' : istAnkunft,
              abfahrtIso: abfObj ? abfObj.iso : estAbfIso,
              planAbfahrtZeit: abfObj ? abfObj.zeit : ankObj.zeit,
              planAbfahrtInfo: abfObj ? abfObj.info : `${estAbfIso.slice(8, 10)}.${estAbfIso.slice(5, 7)}. ${ankObj.zeit} Uhr (ca.)`,
              istAbfahrt: '',
              istAbfahrtInfo: ''
            });
          }

          for (const alt of altDaten) {
            if (!alt || !alt.name) continue;
            const key = alt.name.toLowerCase();
            if (gesammelte.has(key)) continue;

            if (alt.ankunftIso < gesternIso && (!alt.abfahrtIso || alt.abfahrtIso < gesternIso)) continue;

            const elbe = getElbeInfo(alt.name);
            const elbeOrt = elbe?.ort || '';
            const liegtNochLautAis = elbeOrt === 'Im Hafen.';
            const faehrtElbeAbwaerts = Boolean(elbeOrt && elbeOrt !== 'Im Hafen.' && elbeOrt !== 'Auf See / Nordsee' && (alt.imHafen || alt.abgelegt));

            const startTs = new Date(`${alt.ankunftIso}T${alt.planAnkunft || '00:00'}:00Z`).getTime();
            const stundenSeitAnkunft = (now.getTime() - startTs) / (1000 * 60 * 60);

            const wirklichAbgelegt = !liegtNochLautAis && (alt.abgelegt || faehrtElbeAbwaerts || stundenSeitAnkunft >= 24);
            const nochImHafen = !wirklichAbgelegt && (liegtNochLautAis || alt.imHafen || stundenSeitAnkunft >= 0);

            let istAnkunft = alt.istAnkunft || '';
            if (nochImHafen && !istAnkunft) {
              const sigZeit = elbe?.uhrzeit || jetztUhrzeit;
              istAnkunft = `${heuteIso.slice(8, 10)}.${heuteIso.slice(5, 7)}. ${sigZeit} Uhr (Signal)`;
            }

            const istAbfZeit = alt.istAbfahrt || (wirklichAbgelegt ? (elbe?.uhrzeit || jetztUhrzeit) : '');
            const istAbfInfo = alt.istAbfahrtInfo || (wirklichAbgelegt ? `${heuteIso.slice(8, 10)}.${heuteIso.slice(5, 7)}. ${istAbfZeit} Uhr (Signal)` : '');

            finalList.push({
              ...alt,
              imHafen: nochImHafen,
              abgelegt: Boolean(wirklichAbgelegt),
              istAnkunft,
              abfahrtIso: wirklichAbgelegt ? (alt.abfahrtIso || heuteIso) : alt.abfahrtIso,
              istAbfahrt: istAbfZeit,
              istAbfahrtInfo: istAbfInfo
            });
          }

          fs.writeFileSync('fracht.json', JSON.stringify(finalList, null, 2));
          console.log('Gesamt:', finalList.length, 'Im Hafen:', finalList.filter(s => s.imHafen).length, 'Abgelegt:', finalList.filter(s => s.abgelegt).length);
          EOF
          node fetch-fracht.mjs
          rm -f fetch-fracht.mjs

      - name: fracht.json in GitHub speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add fracht.json
          git diff --staged --quiet || git commit -m "Update fracht.json"
          git push
