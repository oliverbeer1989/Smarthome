name: Frachtschiffe Hamburg aktualisieren

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fracht:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright installieren
        run: npm install --no-save playwright && npx playwright install chromium

      - name: Hamburger Schiffe abrufen und fracht.json erstellen
        run: |
          cat << 'EOF' > fetch-fracht.mjs
          import { chromium } from 'playwright';
          import fs from 'fs';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            locale: 'de-DE',
            userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          });
          const page = await context.newPage();

          const apiPayloads = [];
          page.on('response', async (res) => {
            const url = res.url();
            if (url.includes('vessel') || url.includes('ship') || url.includes('schiff') || url.includes('segel') || url.includes('call') || url.includes('api')) {
              try {
                const ct = res.headers()['content-type'] || '';
                if (ct.includes('json')) {
                  apiPayloads.push({ url, data: await res.json() });
                }
              } catch (e) {}
            }
          });

          const year = new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Berlin' }).slice(0, 4);
          const schiffe = [];
          let debugLines = [];

          for (const targetUrl of ['https://hafen-hamburg.de', 'https://hhla.de']) {
            try {
              await page.goto(targetUrl, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForTimeout(5000);
              // Cookie-Banner wegklicken falls vorhanden
              await page.locator('button:has-text("Akzeptieren"), button:has-text("Alle akzeptieren"), button:has-text("Accept")').first().click({ timeout: 2000 }).catch(() => {});
              await page.waitForTimeout(2000);

              const text = await page.evaluate(() => document.body.innerText);
              const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
              debugLines.push(`=== ${targetUrl} (${lines.length} Zeilen) ===`, ...lines.slice(0, 40));

              for (let i = 0; i < lines.length; i++) {
                const line = lines.at(i);
                const lenMatch = line.match(/\b([1-4]\d{2})(?:[.,]\d+)?\s*m\b/i);
                if (!lenMatch) continue;
                const laenge = parseInt(lenMatch.at(1), 10);
                if (laenge < 150) continue;

                const block = lines.slice(Math.max(0, i - 4), Math.min(lines.length, i + 6)).join(' | ');
                const dates = [...block.matchAll(/(\d{2})\.(\d{2})\.(?:(\d{4}|\d{2}))?\s*,?\s*(\d{2}:\d{2})/g)];
                if (dates.length === 0) continue;

                const name = lines.slice(Math.max(0, i - 4), i + 1).find(l =>
                  /^[A-ZÄÖÜ0-9\s\-\.\(\)\/]{3,40}$/.test(l) &&
                  !/^\d/.test(l) &&
                  !/\b\d{3}\s*m\b/i.test(l) &&
                  !/(ANKUNFT|ABFAHRT|TERMINAL|LÄNGE|SCHIFF|CONTAINER|SEGELLISTE)/i.test(l)
                );
                if (!name) continue;

                const lpMatch = block.match(/(Burchardkai|Altenwerder|Tollerort|Eurogate|O'Swaldkai|Steinwerder|Hansaport|Unikai|Wallmann|Athabaskakai|Predöhlkai|Bukarestkai|Dradenau|Waltershof|Kattwyk|C\.?\s*Steinweg|CTB|CTA|CTT|EGH)/i);
                const liegeplatz = lpMatch ? lpMatch.at(1) : 'Hafen Hamburg';

                const parseDt = (m) => {
                  const d = m.at(1);
                  const mo = m.at(2);
                  const yRaw = m.at(3);
                  const z = m.at(4);
                  const y = yRaw ? (yRaw.length === 2 ? '20' + yRaw : yRaw) : year;
                  return { iso: `${y}-${mo}-${d}`, zeit: z, info: `${d}.${mo}. ${z} Uhr` };
                };

                const ank = parseDt(dates.at(0));
                const abf = dates.length > 1 ? parseDt(dates.at(1)) : null;

                if (!schiffe.some(s => s.name === name && s.ankunftIso === ank.iso)) {
                  schiffe.push({
                    name,
                    laenge,
                    liegeplatz,
                    ankunftIso: ank.iso,
                    planAnkunft: ank.zeit,
                    planAnkunftInfo: ank.info,
                    abfahrtIso: abf ? abf.iso : ank.iso,
                    planAbfahrtZeit: abf ? abf.zeit : '',
                    planAbfahrtInfo: abf ? abf.info : ''
                  });
                }
              }
            } catch (e) {
              debugLines.push(`Fehler ${targetUrl}: ${e.message}`);
            }
          }

          await browser.close();
          fs.writeFileSync('fracht.json', JSON.stringify(schiffe, null, 2));
          fs.writeFileSync('fracht-debug.txt', debugLines.join('\n') + '\n\nAPI-URLs:\n' + apiPayloads.map(p => p.url).join('\n'));
          console.log('Gespeicherte Schiffe ab 150m:', schiffe.length);
          EOF
          node fetch-fracht.mjs
          rm -f fetch-fracht.mjs

      - name: fracht.json in GitHub speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add fracht.json fracht-debug.txt
          git diff --staged --quiet || git commit -m "Update fracht.json"
          git push
