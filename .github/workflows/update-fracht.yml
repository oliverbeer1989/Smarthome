name: Frachtschiffe Hamburg aktualisieren

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fracht:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright installieren
        run: npm install --no-save playwright && npx playwright install chromium

      - name: Hamburger Schiffe inkl. Signal-Zeitstempel & Gestern/Morgen abrufen
        run: |
          cat << 'EOF' > fetch-fracht.mjs
          import { chromium } from 'playwright';
          import fs from 'fs';

          let altDaten = [];
          try {
            if (fs.existsSync('fracht.json')) {
              altDaten = JSON.parse(fs.readFileSync('fracht.json', 'utf8'));
            }
          } catch (e) {}

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            locale: 'de-DE',
            userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          });
          const page = await context.newPage();

          const monate = {
            januar: '01', februar: '02', 'märz': '03', maerz: '03', april: '04',
            mai: '05', juni: '06', juli: '07', august: '08',
            september: '09', oktober: '10', november: '11', dezember: '12'
          };

          const now = new Date();
          const heuteIso = now.toLocaleDateString('sv-SE', { timeZone: 'Europe/Berlin' });
          const heuteDate = new Date(heuteIso + 'T00:00:00Z');
          const gesternIso = new Date(heuteDate.getTime() - 86400000).toISOString().slice(0, 10);
          const jetztUhrzeit = now.toLocaleTimeString('de-DE', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit', hour12: false });
          const signalKurz = `${heuteIso.slice(8, 10)}.${heuteIso.slice(5, 7)}. ${jetztUhrzeit}`;

          const gesammelte = new Map();

          const extractCards = (text, quelleTyp) => {
            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            for (let i = 0; i < lines.length; i++) {
              const line = lines.at(i);
              const lenMatch = line.match(/Länge:\s*([1-4]\d{2})(?:[.,]\d+)?\s*m/i)
                || line.match(/^([1-4]\d{2})(?:[.,]\d+)?\s*m$/i);
              if (!lenMatch) continue;
              const laenge = parseInt(lenMatch.at(1), 10);
              if (laenge < 150) continue;

              let dateInfo = null;
              let liegeplatz = 'Hafen Hamburg';
              let name = '';

              for (let back = 1; back <= 6 && (i - back) >= 0; back++) {
                const prev = lines.at(i - back);
                const dm = prev.match(/^(\d{1,2})\.?\s+([A-Za-zäöüÄÖÜ]+)\s+(\d{4})\s+(\d{2}:\d{2})(?:\s*\|\s*(.+))?$/i)
                  || prev.match(/^(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}:\d{2})(?:\s*\|\s*(.+))?$/i);
                if (dm) {
                  let tag, monat, jahr, zeit, term;
                  if (/^\d{2}$/.test(dm.at(2))) {
                    tag = dm.at(1); monat = dm.at(2); jahr = dm.at(3); zeit = dm.at(4); term = (dm.at(5) || '').trim();
                  } else {
                    tag = String(dm.at(1)).padStart(2, '0');
                    monat = monate[dm.at(2).toLowerCase()];
                    jahr = dm.at(3); zeit = dm.at(4); term = (dm.at(5) || '').trim();
                  }
                  if (monat) {
                    dateInfo = { iso: `${jahr}-${monat}-${tag}`, zeit, info: `${tag}.${monat}. ${zeit} Uhr` };
                    if (term && term !== '-') liegeplatz = term;
                    if ((i - back + 1) < i) {
                      const cand = lines.at(i - back + 1);
                      if (cand && !/Tragfähigkeit|Länge:|Breite:|TEU:|BRZ:/i.test(cand)) name = cand;
                    }
                    break;
                  }
                }
              }

              if (!name && i >= 2) {
                const cand = lines.at(i - 2);
                if (cand && !/^\d/.test(cand) && !/Tragfähigkeit|Länge:/i.test(cand)) name = cand;
              }
              if (!name) continue;

              const key = name.toLowerCase();
              const existing = gesammelte.get(key) || {};
              gesammelte.set(key, {
                name,
                laenge,
                liegeplatz: liegeplatz !== 'Hafen Hamburg' ? liegeplatz : (existing.liegeplatz || 'Hafen Hamburg'),
                dateInfo: dateInfo || existing.dateInfo || { iso: heuteIso, zeit: jetztUhrzeit, info: `${signalKurz} Uhr` },
                inHafenListe: existing.inHafenListe || quelleTyp === 'IM_HAFEN',
                inErwartetListe: existing.inErwartetListe || quelleTyp === 'ERWARTET'
              });
            }
          };
          const loadAllFromUrl = async (targetUrl, typ) => {
            try {
              await page.goto(targetUrl, { waitUntil: 'networkidle', timeout: 45000 });
              await page.waitForTimeout(2500);
              await page.locator('button:has-text("Akzeptieren"), button:has-text("Alle akzeptieren")').first().click({ timeout: 1500 }).catch(() => {});
              for (let step = 0; step < 6; step++) {
                await page.locator('button:has-text("Mehr"), a:has-text("Mehr laden"), button:has-text("Weitere")').first().click({ timeout: 1000 }).catch(() => {});
                await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
                await page.waitForTimeout(1000);
              }
              const txt = await page.evaluate(() => document.body.innerText);
              console.log(typ, targetUrl, '-> Zeichen:', txt.length);
              extractCards(txt, typ);
            } catch (e) {
              console.log('Fehler', targetUrl, e.message);
            }
          };

          await loadAllFromUrl('https://hafen-hamburg.de', 'ERWARTET');
          await loadAllFromUrl('https://hafen-hamburg.de', 'IM_HAFEN');
          await loadAllFromUrl('https://hafen-hamburg.de', 'START');

          await browser.close();

          const finalList = [];

          for (const [key, cur] of gesammelte.entries()) {
            const alt = altDaten.find(a => a.name && a.name.toLowerCase() === key);
            const istJetztImHafen = cur.inHafenListe;
            const warSchonImHafen = Boolean(alt?.imHafen);

            let istAnkunft = alt?.istAnkunft || '';
            if (istJetztImHafen && !istAnkunft) {
              istAnkunft = `${signalKurz} Uhr (Signal)`;
            }

            const ankIso = alt?.ankunftIso || cur.dateInfo.iso;
            const planAnk = alt?.planAnkunft || cur.dateInfo.zeit;
            const planAnkInfo = alt?.planAnkunftInfo || cur.dateInfo.info;

            const ankDate = new Date(`${ankIso}T${planAnk}:00Z`);
            const estAbfDate = new Date(ankDate.getTime() + 24 * 60 * 60 * 1000);
            const estAbfIso = estAbfDate.toISOString().slice(0, 10);

            finalList.push({
              name: cur.name,
              laenge: cur.laenge,
              liegeplatz: cur.liegeplatz,
              imHafen: istJetztImHafen || warSchonImHafen,
              abgelegt: false,
              ankunftIso: ankIso,
              planAnkunft: planAnk,
              planAnkunftInfo: planAnkInfo,
              istAnkunft,
              abfahrtIso: alt?.abfahrtIso || estAbfIso,
              planAbfahrtZeit: alt?.planAbfahrtZeit || planAnk,
              planAbfahrtInfo: alt?.planAbfahrtInfo || `${estAbfIso.slice(8, 10)}.${estAbfIso.slice(5, 7)}. ${planAnk} Uhr (ca.)`,
              istAbfahrt: '',
              istAbfahrtInfo: ''
            });
          }

          for (const alt of altDaten) {
            if (!alt || !alt.name) continue;
            const key = alt.name.toLowerCase();
            if (gesammelte.has(key)) continue;

            if (alt.ankunftIso < gesternIso && (!alt.abfahrtIso || alt.abfahrtIso < gesternIso)) continue;

            const wurdeAbgelegt = alt.abgelegt || alt.imHafen;
            const istAbfZeit = alt.istAbfahrt || (wurdeAbgelegt ? jetztUhrzeit : '');
            const istAbfInfo = alt.istAbfahrtInfo || (wurdeAbgelegt ? `${signalKurz} Uhr (Signal)` : '');

            finalList.push({
              ...alt,
              imHafen: false,
              abgelegt: Boolean(wurdeAbgelegt),
              abfahrtIso: alt.abfahrtIso || heuteIso,
              istAbfahrt: istAbfZeit,
              istAbfahrtInfo: istAbfInfo
            });
          }

          fs.writeFileSync('fracht.json', JSON.stringify(finalList, null, 2));
          console.log('Gesamt:', finalList.length, 'Im Hafen:', finalList.filter(s => s.imHafen).length, 'Abgelegt:', finalList.filter(s => s.abgelegt).length);
          EOF
          node fetch-fracht.mjs
          rm -f fetch-fracht.mjs

      - name: fracht.json in GitHub speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add fracht.json
          git diff --staged --quiet || git commit -m "Update fracht.json"
          git push
