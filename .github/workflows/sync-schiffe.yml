name: Schiffsanlaeufe synchronisieren
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Playwright einrichten
        run: npm install --no-save playwright && npx playwright install chromium
      - name: Tabelle im Frame laden
        run: |
          cat << 'EOF' > fetch.js
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
            });
            const page = await context.newPage();

            await page.goto('https://schiffe-in-hamburg.de', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1000);

            // Im Menü auf "Anläufe" klicken, damit das Frame mit der Jahrestabelle lädt
            for (const frame of page.frames()) {
              try {
                const link = frame.locator('a[href*="calls"]').first();
                if (await link.count() > 0) {
                  await link.click();
                  break;
                }
              } catch (e) {}
            }
            await page.waitForTimeout(2500);

            // Den Frame mit der großen Jahrestabelle heraussuchen
            let bestHtml = await page.content();
            for (const frame of page.frames()) {
              try {
                const fHtml = await frame.content();
                console.log('Frame:', frame.url(), 'Bytes:', fHtml.length);
                if (fHtml.length > bestHtml.length) {
                  bestHtml = fHtml;
                }
              } catch (e) {}
            }

            // Fallback: Falls das Frame noch nicht geladen war, direkt mit Referer öffnen
            if (bestHtml.length < 30000) {
              await page.goto('https://schiffe-in-hamburg.de_calls_2026.htm', {
                referer: 'https://schiffe-in-hamburg.de',
                waitUntil: 'networkidle'
              });
              bestHtml = await page.content();
            }

            require('fs').writeFileSync('calls.htm', bestHtml, 'utf8');
            console.log('Gespeichert Bytes:', bestHtml.length);
            await browser.close();
          })();
          EOF
          node fetch.js
          rm -f fetch.js
      - name: Auf GitHub speichern
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add calls.htm
          if ! git diff --staged --quiet; then
            git commit -m "Update Schiffsanlaeufe"
            git pull --rebase
            git push
          fi
