name: Schiffsanlaeufe synchronisieren
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tabelle abrufen
        run: curl -fsSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -e "https://schiffe-in-hamburg.de" "https://schiffe-in-hamburg.de" -o calls.htm
      - name: Auf GitHub speichern
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add calls.htm
          if ! git diff --staged --quiet; then
            git commit -m "Update Schiffsanlaeufe"
            git pull --rebase
            git push
          fi
