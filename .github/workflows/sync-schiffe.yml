name: Schiffsanlaeufe synchronisieren
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Playwright einrichten
        run: npm install --no-save playwright && npx playwright install chromium
      - name: Tabelle aus Frame abrufen
        run: |
          cat << 'EOF' > fetch.js
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();

            // 1. Startseite öffnen (setzt Session & Referer)
            await page.goto('https://schiffe-in-hamburg.de', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1000);

            // 2. Direkt im selben Browser-Kontext die Jahrestabelle laden
            await page.goto('https://schiffe-in-hamburg.dede/_calls_2026.htm', {
              waitUntil: 'networkidle',
              referer: 'https://schiffe-in-hamburg.dede/_calls.htm'
            });
            await page.waitForTimeout(2000);

            // Den Frame mit der großen Jahrestabelle heraussuchen
            let bestHtml = await page.content();
            for (const frame of page.frames()) {
              try {
                const fHtml = await frame.content();
                console.log('Frame:', frame.url(), 'Bytes:', fHtml.length);
                if (fHtml.length > bestHtml.length) {
                  bestHtml = fHtml;
                }
              } catch (e) {}
            }

            require('fs').writeFileSync('calls.htm', bestHtml, 'utf8');
            console.log('Gespeichert:', bestHtml.length);
            await browser.close();
          })();
          EOF
          node fetch.js
          rm -f fetch.js
      - name: Auf GitHub speichern
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add calls.htm
          if ! git diff --staged --quiet; then
            git commit -m "Update Schiffsanlaeufe"
            git pull --rebase
            git push
          fi
