name: Schiffsanlaeufe synchronisieren
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    container:
      image: ://microsoft.com
    steps:
      - uses: actions/checkout@v4
      - name: Tabelle aus Frame abrufen
        run: |
          node -e '
            const { chromium } = require("playwright");
            (async () => {
              const browser = await chromium.launch();
              const page = await browser.newPage();
              await page.goto("https://schiffe-in-hamburg.de", { waitUntil: "networkidle" });
              await page.waitForTimeout(2500);

              let bestHtml = await page.content();
              for (const frame of page.frames()) {
                try {
                  const fHtml = await frame.content();
                  console.log("Frame URL:", frame.url(), "Länge:", fHtml.length);
                  if (fHtml.length > bestHtml.length) {
                    bestHtml = fHtml;
                  }
                } catch (e) {}
              }

              require("fs").writeFileSync("calls.htm", bestHtml, "utf8");
              console.log("Gespeicherte Zeichen:", bestHtml.length);
              await browser.close();
            })();
          '
      - name: Auf GitHub speichern
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add calls.htm
          if ! git diff --staged --quiet; then
            git commit -m "Update Schiffsanlaeufe"
            git pull --rebase
            git push
          fi
