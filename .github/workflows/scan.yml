name: Hamburg Elbe Radar

on:
  schedule:
    - cron: '*/5 * * * *' # Prüft alle 5 Minuten die Elbe
  workflow_dispatch:

concurrency:
  group: hamburg-elbe-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install ws
      - run: node scan.js
        env:
          AIS_API_KEY: ${{ secrets.AIS_API_KEY }}
